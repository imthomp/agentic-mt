name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install lightweight test dependencies
        run: python -m pip install pytest pandas numpy datasets huggingface-hub pyyaml
      - name: Run offline tests
        env:
          PYTHONPATH: src
        run: pytest
